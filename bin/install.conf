# bin/install.sh settings for Off The Record (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: they go in $STATE_DIR/app.env (vault profullstack/offtherecord--prod):
# OTR_ADMIN_KEY, OTR_SALT, GROUPCALL_KEY (riotcoder's gc_ key, an operator), OTR_GUEST_PHONE,
# OTR_HOST_SIP, OTR_HOST_TOOL_SECRET, ELEVENLABS_API_KEY, OTR_AGENT_ID, GEMINI_API_KEY.
#
# offtherecord.podcast and otr.podcast are Moshpit names served by the dev2 edge (Caddy,
# cli-tools dev2/edge/edge.json); offtherecord.podcast.pit.world is the relay, and canonical.
APP=offtherecord
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8814
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
